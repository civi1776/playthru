project_id = "playthru"

# Gateway JWT verification per function. "verify_jwt = true" means the
# gateway rejects requests without a valid Supabase JWT (the public anon key
# is one, so this is a floor, not full auth — each function does its own
# check on top).

[functions.search-courses]
enabled = true
verify_jwt = false          # called by the website without a session; the function requires the anon key itself
import_map = "./functions/search-courses/deno.json"
entrypoint = "./functions/search-courses/index.ts"

[functions.google-places]
enabled = true
verify_jwt = true

[functions.send-push]
enabled = true
verify_jwt = true           # the function additionally requires a real user session

[functions.send-email]
enabled = true
verify_jwt = true           # the function additionally requires a real user session

[functions.tournament-apply]
enabled = true
verify_jwt = false          # website form posts here without a session

[functions.website-forms]
enabled = true
verify_jwt = false          # clocked.golf forms post here without a session; the function requires the anon key itself
